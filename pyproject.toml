[project]
name = "representation-noising"
version = "0.1.0"
description = "Representation Noising defense and attack reproduction"
authors = [{name = "Domenic Rosati", email = "domenicrosati@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate",
    "axolotl==0.18.0",
    "datasets",
    "lm-eval[hf]==0.4.11",
    "numpy",
    "pandas>=2.2,<3",
    "protobuf>=6,<7",
    "pyyaml",
    "sentencepiece>=0.2,<0.3",
    "torch",
    "tqdm",
    "transformers",
]

[tool.poetry]
packages = [{include = "representation_noising"}]

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"
