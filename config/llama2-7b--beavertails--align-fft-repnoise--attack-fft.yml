base_model: null
output_dir: null
datasets:
  - path: data/beavertails_with_refusals_train.json
    ds_type: json
    type: representation_noising.beavertails_refusal
    message_property_mappings:
      max_rows: "1000"
      response_separator: "\n"
dataset_prepared_path: artifacts/tamia/cache/axolotl
dataset_num_proc: 1
val_set_size: 0.0
sequence_len: 256
sample_packing: false
pad_to_sequence_len: true
train_on_inputs: true
shuffle_merged_datasets: false
curriculum_sampling: false
micro_batch_size: 4
gradient_accumulation_steps: 1
num_epochs: 1
learning_rate: 5.0e-5
optimizer: adamw_torch
weight_decay: 0.01
lr_scheduler: cosine
warmup_ratio: 0.1
max_grad_norm: 0.0
bf16: true
tf32: false
gradient_checkpointing: false
attn_implementation: sdpa
seed: 42
data_seed: 42
eval_strategy: "no"
save_strategy: epoch
save_total_limit: 1
save_only_model: true
logging_steps: 10
report_to: []
